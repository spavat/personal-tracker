name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm run fmt:check

            # server and front resolve @personal-tracker/shared types from shared/dist
            - run: npm run build --prefix shared

            - run: npm run typecheck --prefix server

            - run: npx tsc --noEmit -p front

            - run: npm test --prefix server

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ hashFiles('package-lock.json') }}

            - run: npx playwright install --with-deps chromium

            - run: npm test

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      e2e/playwright-report
                      e2e/test-results
                  retention-days: 7

    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [checks, e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                image: [server, front]
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.image }}/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/spavat/personal-tracker-${{ matrix.image }}:latest
                      ghcr.io/spavat/personal-tracker-${{ matrix.image }}:${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # "production" environment with a required reviewer: the job waits for a manual approval in GitHub
        environment: production
        steps:
            - uses: appleboy/ssh-action@v1.2.2
              with:
                  host: ${{ secrets.VPS_HOST }}
                  port: ${{ secrets.VPS_PORT }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e
                      cd ~/apps/personal-tracker
                      # pin the approved version in .env, so a manual `docker compose up` keeps it
                      sed -i '/^TAG=/d' .env
                      echo "TAG=${{ github.sha }}" >> .env
                      docker compose pull server front
                      docker compose up -d --wait
                      docker image prune -f
