server {
	listen 80;
	root /usr/share/nginx/html;

	# hashed file names: cache forever
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# SPA: unknown paths are client-side routes
	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
	}
}
