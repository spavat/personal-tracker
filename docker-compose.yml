name: personal-tracker

services:
    postgres:
        image: postgres:18.1
        environment:
            POSTGRES_USER: tracker
            POSTGRES_PASSWORD: tracker
            # Empty dev database, created on first start of the volume.
            POSTGRES_DB: personal_tracker
            # ICU French collation: same sort order on every machine
            POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=fr"
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            # Postgres 18 images keep the data in a versioned folder under /var/lib/postgresql
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "tracker", "-d", "personal_tracker"]
            interval: 5s
            timeout: 5s
            retries: 30

    mongo:
        # mongo:8 (8.3.x) refuses to start on Linux kernel >= 6.19 (SERVER-121912); 8.2 matches the previous local install.
        image: mongo:8.2
        ports:
            - "${MONGO_PORT:-27017}:27017"
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
            interval: 5s
            timeout: 5s
            retries: 30

    garage:
        image: dxflrs/garage:v2.4.1
        ports:
            - "${GARAGE_PORT:-3900}:3900"
        volumes:
            - ./docker/garage/garage.toml:/etc/garage.toml:ro
            - garage-meta:/var/lib/garage/meta
            - garage-data:/var/lib/garage/data
        healthcheck:
            test: ["CMD", "/garage", "status"]
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    postgres-data:
    mongo-data:
    garage-meta:
    garage-data:
