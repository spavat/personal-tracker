# Traefik fallback while the front/server containers are restarting: every request gets a 503 with the page.
server {
	listen 80;
	root /usr/share/nginx/html;
	error_page 503 /index.html;

	location = /index.html {
		internal;
		add_header Retry-After 5 always;
		add_header Cache-Control "no-store" always;
	}

	location / {
		return 503;
	}
}
