# VPS stack, copied to ~/apps/personal-tracker/docker-compose.yml (with a .env next to it, see .env.example).
# Traefik routes https://tracker.spvt.fr/api/* to the server (prefix stripped) and the rest to the static front.
name: personal-tracker

services:
    postgres:
        image: postgres:18.1
        restart: unless-stopped
        environment:
            POSTGRES_USER: tracker
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
            POSTGRES_DB: personal_tracker
            # ICU French collation, same as the local database
            POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=fr"
        volumes:
            - postgres-data:/var/lib/postgresql
        networks: [internal]
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "tracker", "-d", "personal_tracker"]
            interval: 5s
            timeout: 5s
            retries: 30

    mongo:
        image: mongo:8.2
        restart: unless-stopped
        volumes:
            - mongo-data:/data/db
        networks: [internal]
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
            interval: 5s
            timeout: 5s
            retries: 30

    server:
        image: ghcr.io/spavat/personal-tracker-server:${TAG:-latest}
        restart: unless-stopped
        environment:
            DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@postgres:5432/personal_tracker
            MONGODB_URL: mongodb://mongo:27017/personal_tracker
            PORT: 3000
            # no /api: Traefik strips it, and a path here would replace BetterAuth's basePath (/auth)
            BETTER_AUTH_URL: https://tracker.spvt.fr
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
            FRONT_URL: https://tracker.spvt.fr
            S3_ENDPOINT: ${S3_ENDPOINT:?}
            S3_REGION: ${S3_REGION:?}
            S3_BUCKET: ${S3_BUCKET:?}
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
        depends_on:
            postgres:
                condition: service_healthy
            mongo:
                condition: service_healthy
        networks: [internal, traefik]
        # Traefik only routes to a healthy container: the maintenance page answers during migrations/startup
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3000/auth/get-session').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
                ]
            interval: 5s
            timeout: 5s
            retries: 3
            start_period: 60s
            start_interval: 1s
        labels:
            - traefik.enable=true
            - traefik.docker.network=${TRAEFIK_NETWORK:?}
            - traefik.http.routers.personal-tracker-api.rule=Host(`tracker.spvt.fr`) && PathPrefix(`/api`)
            - traefik.http.routers.personal-tracker-api.entrypoints=${TRAEFIK_ENTRYPOINT:?}
            - traefik.http.routers.personal-tracker-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:?}
            - traefik.http.routers.personal-tracker-api.middlewares=personal-tracker-api-strip
            - traefik.http.middlewares.personal-tracker-api-strip.stripprefix.prefixes=/api
            - traefik.http.services.personal-tracker-api.loadbalancer.server.port=3000

    front:
        image: ghcr.io/spavat/personal-tracker-front:${TAG:-latest}
        restart: unless-stopped
        networks: [traefik]
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
            interval: 5s
            timeout: 5s
            retries: 3
            start_period: 30s
            start_interval: 1s
        labels:
            - traefik.enable=true
            - traefik.docker.network=${TRAEFIK_NETWORK:?}
            - traefik.http.routers.personal-tracker.rule=Host(`tracker.spvt.fr`)
            - traefik.http.routers.personal-tracker.entrypoints=${TRAEFIK_ENTRYPOINT:?}
            - traefik.http.routers.personal-tracker.tls.certresolver=${TRAEFIK_CERTRESOLVER:?}
            - traefik.http.services.personal-tracker.loadbalancer.server.port=80

    # Fallback while front/server restart: only started by the CI deploy job around the restart (profile: not
    # started by a plain `docker compose up`). priority=1: the front and /api routers (priority = rule length)
    # always win when they exist.
    maintenance:
        image: nginx:1.29-alpine
        profiles: [maintenance]
        volumes:
            - ./maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./maintenance/index.html:/usr/share/nginx/html/index.html:ro
        networks: [traefik]
        labels:
            - traefik.enable=true
            - traefik.docker.network=${TRAEFIK_NETWORK:?}
            - traefik.http.routers.personal-tracker-maintenance.rule=Host(`tracker.spvt.fr`)
            - traefik.http.routers.personal-tracker-maintenance.priority=1
            - traefik.http.routers.personal-tracker-maintenance.entrypoints=${TRAEFIK_ENTRYPOINT:?}
            - traefik.http.routers.personal-tracker-maintenance.tls.certresolver=${TRAEFIK_CERTRESOLVER:?}
            - traefik.http.services.personal-tracker-maintenance.loadbalancer.server.port=80

networks:
    internal:
    traefik:
        external: true
        name: ${TRAEFIK_NETWORK:?}

volumes:
    postgres-data:
    mongo-data:
